name: Test badges

on:
  push:
    branches: [master]
    paths: [api/**, test/**, README.md, .github/workflows/links.yml, .github/workflows/test.yml]
  pull_request:
    paths: [api/**, test/**, README.md, .github/workflows/links.yml, .github/workflows/test.yml]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # same major as the Node.js version in the Vercel project settings; no dependencies to install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test
