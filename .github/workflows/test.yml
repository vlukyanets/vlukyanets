name: Test badges

on:
  push:
    branches: [master]
    paths: [api/**, test/**, README.md, .github/workflows/links.yml, .github/workflows/test.yml]
  pull_request:
    paths: [api/**, test/**, README.md, .github/workflows/links.yml, .github/workflows/test.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # same major as the Node.js version in the Vercel project settings; no dependencies to install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test
