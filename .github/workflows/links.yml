name: Check links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # these sites answer 403 to bots but work in a browser
          args: >-
            --no-progress
            --exclude projecteuler\.net
            --exclude cprogramming\.com
            --exclude gnu\.org
            --exclude linux\.org
            --exclude spoj\.com
            README.md
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in README
          content-filepath: ./lychee/out.md
          labels: broken-links
